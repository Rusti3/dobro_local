name: dobrie-dela-max

x-app-environment: &app-environment
  NODE_ENV: production
  HOST: 0.0.0.0
  PORT: 3210
  DATABASE_URL: postgresql://dobrie_dela_app:${POSTGRES_APP_PASSWORD:-local-app-password}@postgres:5432/dobrie_dela
  DB_SCHEMA: app
  DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
  # Docker-local default is a cookie demo session; production MAX is opt-in.
  DEMO_MODE: ${DOCKER_DEMO_MODE:-true}
  MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-}
  MAX_BOT_USERNAME: ${MAX_BOT_USERNAME:-}
  MAX_MINI_APP_URL: ${MAX_MINI_APP_URL:-}
  MAX_WEBHOOK_URL: ${MAX_WEBHOOK_URL:-}
  MAX_WEBHOOK_SECRET: ${MAX_WEBHOOK_SECRET:-}
  MAX_POLLING: ${MAX_POLLING:-false}
  MAX_CA_BUNDLE: /app/russiantrustedca.pem
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_BASE_URL: ${DOCKER_LLM_BASE_URL:-http://host.docker.internal:8080/v1}
  LLM_MODEL: ${LLM_MODEL:-gpt-5.6-terra}
  CATALOG_CITIES: ${CATALOG_CITIES:-Москва}
  CATALOG_SYNC_ENABLED: ${CATALOG_SYNC_ENABLED:-true}
  CATALOG_SYNC_ON_START: ${CATALOG_SYNC_ON_START:-true}
  CATALOG_SYNC_INTERVAL_MS: ${CATALOG_SYNC_INTERVAL_MS:-3600000}
  DOBRO_CONCURRENCY: ${DOBRO_CONCURRENCY:-4}
  ANNOTATION_CONCURRENCY: ${ANNOTATION_CONCURRENCY:-5}
  ANNOTATION_BATCH_SIZE: ${ANNOTATION_BATCH_SIZE:-100}
  ANNOTATION_POLL_INTERVAL_MS: ${ANNOTATION_POLL_INTERVAL_MS:-15000}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-local-admin-password}
      POSTGRES_DB: dobrie_dela
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-local-app-password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-54329}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dobrie_dela"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    image: dobrie-dela-max:local
    build: .
    ports:
      - "127.0.0.1:3210:3210"
    environment: *app-environment
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3210/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    image: dobrie-dela-max:local
    command: ["node", "server/worker.js"]
    environment: *app-environment
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
